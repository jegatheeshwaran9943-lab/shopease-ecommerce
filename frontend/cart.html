<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart - ShopEase</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- Existing CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/responsive.css">

    <style>

        .cart-container {
            min-height: 70vh;
        }

        .cart-item {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,.08);
        }

        .cart-item img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 10px;
        }

        .cart-title {
            font-weight: 600;
        }

        .cart-price {
            color: #198754;
            font-size: 20px;
            font-weight: 700;
        }

        .cart-summary {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,.1);
        }

        .remove-btn {
            border-radius: 20px;
        }

        @media(max-width: 576px) {

            .cart-item img {
                width: 90px;
                height: 90px;
            }

        }

    </style>

</head>


<body>


<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand"
           href="index.html">

            <i class="fa-solid fa-cart-shopping"></i>
            ShopEase

        </a>


        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarContent">

            <span class="navbar-toggler-icon"></span>

        </button>


        <div
            class="collapse navbar-collapse"
            id="navbarContent">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">

                    <a class="nav-link"
                       href="index.html">

                        <i class="fa-solid fa-house"></i>
                        Home

                    </a>

                </li>


                <li class="nav-item">

                    <a class="nav-link active"
                       href="cart.html">

                        <i class="fa-solid fa-cart-shopping"></i>

                        Cart

                        <span
                            id="cart-count"
                            class="badge bg-danger">

                            0

                        </span>

                    </a>

                </li>


                <li class="nav-item">

                    <a class="nav-link"
                       href="orders.html">

                        <i class="fa-solid fa-box"></i>
                        Orders

                    </a>

                </li>


                <li class="nav-item">

                    <a class="nav-link"
                       href="profile.html">

                        <i class="fa-solid fa-user"></i>
                        Profile

                    </a>

                </li>


                <li class="nav-item">

                    <a
                        href="#"
                        class="nav-link"
                        id="logoutBtn">

                        <i class="fa-solid fa-right-from-bracket"></i>
                        Logout

                    </a>

                </li>

            </ul>

        </div>

    </div>

</nav>



<!-- ================= CART ================= -->

<div class="container cart-container my-5">

    <h2 class="text-center mb-4">

        <i class="fa-solid fa-cart-shopping"></i>

        My Shopping Cart

    </h2>


    <div class="row">


        <!-- CART ITEMS -->

        <div class="col-lg-8">

            <div id="cart-items">

                <!-- JavaScript will add products here -->

            </div>

        </div>



        <!-- CART SUMMARY -->

        <div class="col-lg-4">

            <div class="cart-summary">

                <h4 class="mb-4">
                    Order Summary
                </h4>


                <div class="d-flex justify-content-between mb-3">

                    <span>
                        Items
                    </span>

                    <span id="total-items">
                        0
                    </span>

                </div>


                <div class="d-flex justify-content-between mb-3">

                    <span>
                        Subtotal
                    </span>

                    <strong id="subtotal">
                        ₹0
                    </strong>

                </div>


                <hr>


                <div class="d-flex justify-content-between mb-4">

                    <strong>
                        Total
                    </strong>

                    <strong
                        id="grand-total"
                        class="text-success">

                        ₹0

                    </strong>

                </div>


                <button
                    id="checkoutBtn"
                    class="btn btn-primary w-100">

                    <i class="fa-solid fa-credit-card"></i>

                    Proceed to Checkout

                </button>

            </div>

        </div>

    </div>

</div>



<!-- ================= FOOTER ================= -->

<footer class="bg-dark text-white text-center p-4">

    <p class="mb-0">

        © 2026 ShopEase. All Rights Reserved.

    </p>

</footer>



<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<!-- Cart JS -->

<script src="js/cart.js"></script>

<!-- Logout -->

<script src="js/logout.js"></script>


</body>

</html>
