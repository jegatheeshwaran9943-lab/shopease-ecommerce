<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile - ShopEase</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/profile.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark px-4">

        <a class="navbar-brand" href="index.html">
            🛍️ ShopEase
        </a>

        <div>

            <a href="index.html" class="btn btn-outline-light me-2">
                Home
            </a>

            <a href="cart.html" class="btn btn-outline-light me-2">
                🛒 Cart
            </a>

            <a href="orders.html" class="btn btn-outline-light me-2">
                📦 My Orders
            </a>

            <button id="logoutBtn" class="btn btn-danger">
                Logout
            </button>

        </div>

    </nav>


    <!-- Profile -->

    <div class="container mt-5">

        <div class="card profile-card shadow">

            <div class="card-header bg-dark text-white">

                <h2 class="mb-0">
                    My Profile
                </h2>

            </div>


            <div class="card-body">

                <form id="profileForm">

                    <!-- Name -->

                    <div class="mb-3">

                        <label class="form-label">
                            Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            class="form-control"
                            placeholder="Enter your name"
                            required>

                    </div>


                    <!-- Email -->

                    <div class="mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            class="form-control"
                            placeholder="Enter your email"
                            required>

                    </div>


                    <!-- Phone -->

                    <div class="mb-3">

                        <label class="form-label">
                            Phone
                        </label>

                        <input
                            type="text"
                            id="phone"
                            class="form-control"
                            placeholder="Enter your phone"
                            required>

                    </div>


                    <!-- Buttons -->

                    <div class="mt-4">

                        <button
                            type="submit"
                            class="btn btn-primary">

                            💾 Update Profile

                        </button>


                        <button
                            type="button"
                            id="cancelBtn"
                            class="btn btn-secondary ms-2">

                            Cancel

                        </button>

                    </div>


                    <!-- Message -->

                    <div
                        id="message"
                        class="mt-3">
                    </div>

                </form>

            </div>

        </div>

    </div>


    <script src="js/profile.js"></script>

</body>

</html>
