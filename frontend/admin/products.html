<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Product Management</title>

    <link rel="stylesheet" href="css/products.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">

        <h2>Admin Panel</h2>

        <ul>

            <li>
                <a href="dashboard.html">
                    <i class="fas fa-chart-line"></i>
                    Dashboard
                </a>
            </li>

            <li>
                <a href="users.html">
                    <i class="fas fa-users"></i>
                    Users
                </a>
            </li>

            <li class="active">
                <a href="products.html">
                    <i class="fas fa-box"></i>
                    Products
                </a>
            </li>

        </ul>

    </div>

    <!-- Main Content -->
    <div class="main-content">

        <h1>Product Management</h1>

        <!-- Add Product Button -->
        <button id="addProductBtn">
            <i class="fas fa-plus"></i>
            Add Product
        </button>

        <!-- Search -->
        <input
            type="text"
            id="searchProduct"
            placeholder="Search Product..."
        >

        <!-- Product Table -->
        <table>

            <thead>

                <tr>

                    <th>ID</th>
                    <th>Image</th>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th>Actions</th>

                </tr>

            </thead>

            <tbody id="productTable">

            </tbody>

        </table>

    </div>

    <!-- Product Modal -->
    <div id="productModal" class="modal">

        <div class="modal-content">

            <span id="closeModal">&times;</span>

            <h2>Add Product</h2>

            <form id="productForm">

                <input
                    type="text"
                    id="name"
                    placeholder="Product Name"
                    required
                >

                <input
                    type="text"
                    id="category"
                    placeholder="Category"
                    required
                >

                <input
                    type="number"
                    id="price"
                    placeholder="Price"
                    required
                >

                <input
                    type="number"
                    id="stock"
                    placeholder="Stock"
                    required
                >

                <textarea
                    id="description"
                    placeholder="Description"
                ></textarea>

                <input
                    type="file"
                    id="image"
                    accept="image/*"
                >

                <button type="submit">
                    Save Product
                </button>

            </form>

        </div>

    </div>

    <script src="js/products.js"></script>

</body>
</html>
