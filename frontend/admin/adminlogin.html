<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Login CSS -->
    <link rel="stylesheet" href="../css/login.css">

</head>

<body>

    <div class="container">

        <div class="row justify-content-center align-items-center min-vh-100">

            <div class="col-md-5">

                <div class="card shadow p-4">

                    <h2 class="text-center mb-4">
                        Admin Login
                    </h2>


                    <form id="adminLoginForm">

                        <!-- Email -->

                        <div class="mb-3">

                            <label
                                for="adminEmail"
                                class="form-label">

                                Email

                            </label>

                            <input
                                type="email"
                                id="adminEmail"
                                class="form-control"
                                placeholder="Enter admin email"
                                required>

                        </div>


                        <!-- Password -->

                        <div class="mb-3">

                            <label
                                for="adminPassword"
                                class="form-label">

                                Password

                            </label>

                            <input
                                type="password"
                                id="adminPassword"
                                class="form-control"
                                placeholder="Enter admin password"
                                required>

                        </div>


                        <!-- Login Button -->

                        <button
                            type="submit"
                            class="btn btn-dark w-100">

                            Admin Login

                        </button>

                    </form>


                    <!-- User Login -->

                    <div class="text-center mt-3">

                        <a href="../login.html">
                            User Login
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- IMPORTANT -->
    <script src="adminlogin.js"></script>

</body>

</html>
