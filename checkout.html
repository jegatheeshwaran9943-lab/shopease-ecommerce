<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Checkout - ShopEase</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <h2 class="text-center mb-4">
        🛒 Checkout
    </h2>

    <div class="card p-4">

        <h4>Delivery Details</h4>

        <hr>

        <form id="checkoutForm">

            <!-- FULL NAME -->
            <div class="mb-3">

                <label>Full Name</label>

                <input
                    type="text"
                    id="fullName"
                    class="form-control"
                    required>

            </div>


            <!-- EMAIL -->
            <div class="mb-3">

                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    class="form-control"
                    required>

            </div>


            <!-- PHONE -->
            <div class="mb-3">

                <label>Phone</label>

                <input
                    type="text"
                    id="phone"
                    class="form-control"
                    required>

            </div>


            <!-- ADDRESS -->
            <div class="mb-3">

                <label>Address</label>

                <textarea
                    id="address"
                    class="form-control"
                    required></textarea>

            </div>


            <!-- CITY / STATE / PINCODE -->
            <div class="row">

                <div class="col-md-4 mb-3">

                    <label>City</label>

                    <input
                        type="text"
                        id="city"
                        class="form-control"
                        required>

                </div>


                <div class="col-md-4 mb-3">

                    <label>State</label>

                    <input
                        type="text"
                        id="state"
                        class="form-control"
                        required>

                </div>


                <div class="col-md-4 mb-3">

                    <label>Pincode</label>

                    <input
                        type="text"
                        id="pincode"
                        class="form-control"
                        required>

                </div>

            </div>


            <!-- PAYMENT METHOD -->
            <div class="mb-3">

                <label>Payment Method</label>

                <select
                    id="paymentMethod"
                    class="form-control"
                    required>

                    <option value="COD">
                        Cash on Delivery
                    </option>

                    <option value="Razorpay">
                        Razorpay
                    </option>

                </select>

            </div>


            <!-- TOTAL -->
            <div class="mb-4">

                <h2>
                    Total:
                    <span id="totalAmount">₹0</span>
                </h2>

            </div>


            <!-- PLACE ORDER -->
            <button
                type="button"
                id="placeOrder"
                class="btn btn-success w-100">

                🛍️ Place Order

            </button>

        </form>

    </div>

</div>


<script src="js/checkout.js"></script>

</body>

</html>
